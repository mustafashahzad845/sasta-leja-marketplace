<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Sasta Leja</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/dashboard.css">
</head>
<body class="dash-page">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand" aria-label="Sasta Leja Home">
        <div class="navbar-brand-icon">S</div>
        <div class="navbar-brand-text">Sasta Leja</div>
      </a>

      <div class="navbar-actions">
        <button class="dash-user-chip" id="userChipBtn" aria-label="Account" aria-haspopup="true">
          <div class="dash-avatar" id="navAvatar">A</div>
          <div class="dash-user-chip-info">
            <div class="dash-user-chip-name" id="navUserName">Buyer</div>
            <div class="dash-user-chip-role">Buyer</div>
          </div>
        </button>
        <!-- Profile popup -->
        <div class="dash-profile-popup" id="profilePopup" aria-hidden="true">
          <div class="dash-profile-popup-inner">
            <div class="dash-profile-popup-header">
              <div class="dash-avatar dash-profile-avatar" id="popupAvatar">A</div>
              <div>
                <div class="dash-profile-popup-name" id="popupName">Buyer</div>
                <div class="dash-profile-popup-role" id="popupRole">Buyer</div>
              </div>
            </div>
            <div class="dash-profile-popup-body">
              <div class="dash-profile-row">
                <span class="dash-profile-label">Email</span>
                <span class="dash-profile-value" id="popupEmail">—</span>
              </div>
              <div class="dash-profile-row">
                <span class="dash-profile-label">Member since</span>
                <span class="dash-profile-value" id="popupJoined">—</span>
              </div>
            </div>
            <button class="btn btn-secondary btn-sm dash-profile-logout" id="popupLogout">Logout</button>
          </div>
        </div>
        <a href="index.html" class="btn btn-ghost">← Store</a>
        <button class="dash-icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="dash-dot"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="dash-shell">
    <!-- Sidebar -->
    <aside class="dash-sidebar" aria-label="Account navigation">
      <div class="dash-sidebar-label">My Account</div>
      <button class="dash-nav-item active" data-panel="overview">
        <span class="dash-nav-icon">🏠</span> Overview
      </button>

      <div class="dash-sidebar-profile">
        <div class="dash-avatar" style="width: 34px; height: 34px; font-size: 13px;" id="sidebarAvatar">A</div>
        <div>
          <div class="dash-sidebar-profile-name" id="sidebarName">Buyer</div>
          <div class="dash-sidebar-profile-role" id="sidebarRole">Member since 2024</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="dash-main">

      <!-- ==================== OVERVIEW ==================== -->
      <section class="dash-panel active" id="panel-overview">
        <div class="dash-panel-header">
          <div>
            <div class="dash-eyebrow">Marketplace</div>
            <h1 class="dash-title">All Products</h1>
            <p class="dash-subtitle">Browse every product available on Sasta Leja.</p>
          </div>
        </div>

        <div class="dash-filters">
          <button class="dash-filter active" data-category="all">All</button>
          <button class="dash-filter" data-category="Electronics">Electronics</button>
          <button class="dash-filter" data-category="Fashion">Fashion</button>
          <button class="dash-filter" data-category="Home & Living">Home & Living</button>
          <button class="dash-filter" data-category="Beauty">Beauty</button>
          <button class="dash-filter" data-category="Sports">Sports</button>
          <button class="dash-filter" data-category="Books">Books</button>
          <button class="dash-filter" data-category="Other">Other</button>
        </div>

        <div class="dash-toolbar" style="margin-bottom: 18px;">
          <div class="dash-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="productSearch" placeholder="Search products...">
          </div>
          <select id="conditionFilter" class="dash-filter-select" aria-label="Filter by condition">
            <option value="all" selected>All Conditions</option>
            <option value="New">New</option>
            <option value="Used">Used</option>
          </select>
          <select id="priceSort" class="dash-filter-select" aria-label="Sort by price">
            <option value="default" selected>Sort: Newest First</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
          </select>
        </div>

        <div class="dash-card" style="padding: 24px;">
          <div class="product-grid" id="buyerProductGrid"></div>
          <div id="buyerProductsStatus" style="display:none; text-align:center; padding:48px 20px; color:var(--muted);"></div>
        </div>
      </section>

    </main>
  </div>

  <div class="dash-toast" id="dashToast"></div>

  <script>
    // Auth guard for buyer dashboard
    var API_BASE = 'http://localhost:4000/api';
    var token = localStorage.getItem('token');
    var currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { currentUser = null; }

    if (!token || !currentUser || String(currentUser.role || '').toLowerCase() !== 'buyer') {
      window.location.href = 'login.html';
    }

    // Fetch fresh user data
    async function loadUserProfile() {
      try {
        var response = await fetch(API_BASE + '/me', {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        if (response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          try { document.cookie = 'token=; path=/; max-age=0'; } catch(e) {}
          window.location.href = 'login.html';
          return;
        }
        var data = await response.json();
        if (!data.success || !data.data) return;

        var u = data.data;
        var initial = (u.fullName || 'B').trim().charAt(0).toUpperCase();

        document.getElementById('navAvatar').textContent = initial;
        document.getElementById('popupAvatar').textContent = initial;
        document.getElementById('sidebarAvatar').textContent = initial;

        document.getElementById('navUserName').textContent = u.fullName || 'Buyer';
        document.getElementById('popupName').textContent = u.fullName || 'Buyer';
        document.getElementById('sidebarName').textContent = u.fullName || 'Buyer';

        var roleLabel = u.role === 'seller' ? 'Seller' : 'Buyer';
        document.querySelector('#userChipBtn .dash-user-chip-role').textContent = roleLabel;
        document.getElementById('popupRole').textContent = roleLabel;
        document.getElementById('sidebarRole').textContent = 'Member since ' + (u.createdAt ? new Date(u.createdAt).getFullYear() : '2024');

        document.getElementById('popupEmail').textContent = u.email || '—';
        document.getElementById('popupJoined').textContent = u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' }) : '—';
      } catch (error) {
        console.error('Failed to load profile:', error);
      }
    }

    loadUserProfile();

    // Profile popup toggle
    var popup = document.getElementById('profilePopup');
    var userChipBtn = document.getElementById('userChipBtn');
    var popupLogout = document.getElementById('popupLogout');

    function closePopup() {
      popup.classList.remove('show');
      popup.setAttribute('aria-hidden', 'true');
    }

    userChipBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = popup.classList.contains('show');
      if (isOpen) {
        closePopup();
      } else {
        popup.classList.add('show');
        popup.setAttribute('aria-hidden', 'false');
      }
    });

    document.addEventListener('click', function(e) {
      if (!popup.contains(e.target) && e.target !== userChipBtn && !userChipBtn.contains(e.target)) {
        closePopup();
      }
    });

    popupLogout.addEventListener('click', function() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      try { document.cookie = 'token=; path=/; max-age=0'; } catch(e) {}
      window.location.href = 'login.html';
    });

    // Sidebar / nav tab switching
    document.querySelectorAll('.dash-nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var target = this.dataset.panel;
        document.querySelectorAll('.dash-nav-item').forEach(function(i) { i.classList.remove('active'); });
        this.classList.add('active');
        document.querySelectorAll('.dash-panel').forEach(function(p) { p.classList.remove('active'); });
        var panel = document.getElementById('panel-' + target);
        if (panel) panel.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // ===================== ALL PRODUCTS (live from backend) =====================

    var grid = document.getElementById('buyerProductGrid');
    // NOTE: do not name this "status" — window.status is a built-in string
    // property, so a top-level `var status` silently coerces the element to a
    // string and every .style access fails.
    var productsStatusEl = document.getElementById('buyerProductsStatus');

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function formatPrice(n) {
      return 'PKR ' + Number(n || 0).toLocaleString('en-IN');
    }

    function categoryEmoji(category) {
      var c = (category || '').toLowerCase();
      if (c.indexOf('electr') !== -1) return '📱';
      if (c.indexOf('fashion') !== -1 || c.indexOf('shoe') !== -1 || c.indexOf('cloth') !== -1) return '👕';
      if (c.indexOf('home') !== -1 || c.indexOf('furniture') !== -1 || c.indexOf('lamp') !== -1) return '🏠';
      if (c.indexOf('beauty') !== -1) return '💄';
      if (c.indexOf('sport') !== -1) return '🏃';
      if (c.indexOf('book') !== -1) return '📚';
      if (c.indexOf('game') !== -1) return '🎮';
      if (c.indexOf('vehicle') !== -1 || c.indexOf('car') !== -1) return '🚗';
      return '📦';
    }

    function productCard(p) {
      var image = p.image
        ? '<img src="' + p.image + '" alt="' + escapeHtml(p.name) + '" loading="lazy">'
        : '<span class="product-card-image-placeholder">' + categoryEmoji(p.category) + '</span>';

      var badge = p.condition
        ? '<span class="product-card-badge" style="background:' + (p.condition === 'Used' ? '#b45309' : '#10b981') + ';">' + escapeHtml(p.condition) + '</span>'
        : '';

      var sellerName = (p.seller && p.seller.fullName) ? p.seller.fullName : 'Sasta Leja Seller';

      return (
        '<article class="product-card" tabindex="0" data-id="' + p._id + '">' +
          '<div class="product-card-image">' + image + badge + '</div>' +
          '<div class="product-card-body">' +
            '<span class="product-card-category">' + escapeHtml(p.category) + '</span>' +
            '<h3 class="product-card-title">' + escapeHtml(p.name) + '</h3>' +
            '<span class="product-card-seller">🏪 Seller: <strong>' + escapeHtml(sellerName) + '</strong></span>' +
            '<div class="product-card-meta">' +
              '<span>📍 ' + escapeHtml(p.location || 'N/A') + '</span>' +
              '<span>' + escapeHtml(p.condition || '') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="product-card-footer">' +
            '<div>' +
              '<span class="product-card-price">' + formatPrice(p.price) + '</span>' +
            '</div>' +
            '<button class="product-card-add" aria-label="Add to cart">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            '</button>' +
          '</div>' +
        '</article>'
      );
    }

    function setStatus(message) {
      if (!productsStatusEl) return;
      productsStatusEl.textContent = message;
      productsStatusEl.style.display = 'block';
    }

    var conditionFilter = document.getElementById('conditionFilter');
    var priceSort = document.getElementById('priceSort');
    var searchInput = document.getElementById('productSearch');

    function buildQueryString() {
      var cat = document.querySelector('.dash-filter[data-category].active');
      var category = cat ? cat.dataset.category : 'all';
      var condition = conditionFilter ? conditionFilter.value : 'all';
      var sort = priceSort ? priceSort.value : 'default';
      var search = searchInput ? (searchInput.value || '').trim() : '';

      var queryParts = [];
      if (category && category !== 'all') queryParts.push('category=' + encodeURIComponent(category));
      if (condition && condition !== 'all') queryParts.push('condition=' + encodeURIComponent(condition));
      if (sort && sort !== 'default') queryParts.push('sort=' + encodeURIComponent(sort));
      if (search) queryParts.push('search=' + encodeURIComponent(search));
      return queryParts.length ? '?' + queryParts.join('&') : '';
    }

    function syncURL() {
      var qs = buildQueryString();
      var url = window.location.pathname + qs;
      history.replaceState(null, '', url);
    }

    function restoreFiltersFromURL() {
      var params = new URLSearchParams(window.location.search);
      var cat = params.get('category');
      var cond = params.get('condition');
      var sort = params.get('sort');
      var search = params.get('search');

      if (cat) {
        var chip = document.querySelector('.dash-filter[data-category="' + cat + '"]');
        if (chip) {
          document.querySelectorAll('.dash-filter[data-category]').forEach(function(c) { c.classList.remove('active'); });
          chip.classList.add('active');
        }
      }
      if (cond && conditionFilter) {
        conditionFilter.value = cond;
      }
      if (sort && priceSort) {
        priceSort.value = sort;
      }
      if (search && searchInput) {
        searchInput.value = search;
      }
    }

    // Category filter chips (same categories as the seller dashboard)
    document.querySelectorAll('.dash-filter[data-category]').forEach(function(chip) {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.dash-filter[data-category]').forEach(function(c) { c.classList.remove('active'); });
        this.classList.add('active');
        syncURL();
        loadProducts();
      });
    });

    // Restore all filters from URL on load
    restoreFiltersFromURL();

    // Condition + price-sort dropdowns
    if (conditionFilter) conditionFilter.addEventListener('change', function() {
      syncURL();
      loadProducts();
    });
    if (priceSort) priceSort.addEventListener('change', function() {
      syncURL();
      loadProducts();
    });

    async function loadProducts() {
      setStatus('Loading products...');
      var qs = buildQueryString();
      var fetchUrl = API_BASE + '/get-all-products' + qs;

      try {
        var response = await fetch(fetchUrl, {
          headers: { 'Accept': 'application/json' },
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var data = await response.json();
        var products = Array.isArray(data.data) ? data.data.filter(Boolean) : [];
        if (!products.length) {
          grid.innerHTML = '';
          setStatus('No products found. Try changing the filters.');
          return;
        }
        productsStatusEl.style.display = 'none';
        grid.innerHTML = products.map(productCard).join('');
      } catch (error) {
        console.error('Failed to load products:', error);
        grid.innerHTML = '';
        setStatus('Could not load products. Is the server running?');
      }
    }

    // Search debounce (same pattern as the seller dashboard)
    var searchTimer = null;
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
          syncURL();
          loadProducts();
        }, 250);
      });
    }

    // Card click → product detail (ignore add-to-cart clicks)
    grid.addEventListener('click', function(e) {
      var card = e.target.closest('.product-card');
      if (!card) return;
      if (e.target.closest('.product-card-add')) return;
      window.location.href = 'product.html?id=' + card.dataset.id;
    });

    // Keyboard: Enter opens the product
    grid.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var card = e.target.closest('.product-card');
      if (card) window.location.href = 'product.html?id=' + card.dataset.id;
    });

    // Add to cart feedback (delegated)
    grid.addEventListener('click', function(e) {
      var btn = e.target.closest('.product-card-add');
      if (!btn) return;
      e.stopPropagation();
      var original = btn.innerHTML;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      btn.style.background = '#10b981';
      showToast('Added to cart 🛒');
      setTimeout(function() {
        btn.innerHTML = original;
        btn.style.background = '';
      }, 1200);
    });

    // Toast
    var toastEl = document.getElementById('dashToast');
    var toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
    }

    loadProducts();
  </script>
</body>
</html>
